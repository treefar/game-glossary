<html lang="zh-Hant">

<title>十詞條擴充狀態</title>
<style>
:root {
  color-scheme: light dark;

  --warn-bg: #fef9c3; --warn-fg: #854d0e; --warn-bd: #fde047;
  --blocked-bg: #e5e7eb; --blocked-fg: #374151; --blocked-bd: #9ca3af;
  --danger-bg: #fee2e2; --danger-fg: #991b1b; --danger-bd: #fca5a5;
  --info-bg: #dbeafe; --info-fg: #1e40af; --info-bd: #93c5fd;

}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18181b; --fg: #e4e4e7; --muted: #a1a1aa; --bg2: #232327; --bg3: #3f3f46;
    --border: #52525b; --accent: #60a5fa;
    --ok-bg: #052e16; --ok-fg: #86efac; --ok-bd: #166534;
    --warn-bg: #422006; --warn-fg: #fde047; --warn-bd: #854d0e;
    --blocked-bg: #374151; --blocked-fg: #d1d5db; --blocked-bd: #6b7280;
    --danger-bg: #450a0a; --danger-fg: #fca5a5; --danger-bd: #991b1b;
    --info-bg: #1e3a5f; --info-fg: #93c5fd; --info-bd: #1e40af;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {

.container { max-width: 1200px; margin: 0 auto; padding: 16px; }

.card .den { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

.match-count { font-size: 0.8rem; color: var(--muted); flex-basis: 100%; }

/* 表格 */

.na-note { font-size: 0.85rem; color: var(--muted); margin: 4px 0; }
.table-wrap { overflow: auto; max-height: 75vh; margin: 8px 0 16px; border-radius: 8px; border: 1px solid var(--border); }
table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { position: sticky; top: 0; background: var(--bg3); text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); white-space: nowrap; z-index: 2; }
td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }

tbody tr.row.zebra { background: var(--bg2); }
tbody tr.row:hover { background: var(--bg3); }
tr.row.expandable { cursor: pointer; }
tr.row.expandable td:first-child::before { content: "▶"; font-size: 0.65rem; margin-right: 6px; display: inline-block; transition: transform 0.15s; color: var(--muted); }

.detail-grid dt { font-weight: 600; }
.detail-grid dd { margin: 0; overflow-wrap: anywhere; }

.tone-ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-bd); }
.tone-warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-bd); }
.tone-blocked { background: var(--blocked-bg); color: var(--blocked-fg); border-color: var(--blocked-bd); }
.tone-danger { background: var(--danger-bg); color: var(--danger-fg); border-color: var(--danger-bd); }
.tone-info { background: var(--info-bg); color: var(--info-fg); border-color: var(--info-bd); }

.box { border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; background: var(--bg2); font-size: 0.88rem; }
.box.unknowns { border-left: 4px solid var(--warn-bd); }
.box ul { margin: 4px 0; padding-left: 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.8rem; }
@media (max-width: 640px) {
  .controls { position: static; }
  .detail-grid { position: sticky; left: 16px; width: calc(100vw - 88px); }
}
.footer { text-align: center; font-size: 0.8rem; color: var(--muted); margin: 32px 0 16px; }
</style>
</head>
<body>
<div class="container">

    <p class="sub" id="subtitle"></p>

  <h2>狀態圖例</h2>

  <div class="footer" id="footer"></div>
</div>

  uk.innerHTML = D.unknowns.length
    ? '<ul>' + D.unknowns.map(function (u) { return '<li>' + esc(u) + '</li>'; }).join('') + '</ul>'
    : '<p>目前沒有登記的資料缺口。</p>';

  document.getElementById('authorities').innerHTML = '<ul>' + D.meta.authorities.map(function (a) {
    return '<li><code>' + esc(a.path) + '</code>：' + esc(a.role) + (a.note ? '（' + esc(a.note) + '）' : '') + '</li>';
  }).join('') + '</ul>';

  document.getElementById('legend').innerHTML = D.status_levels.map(function (s) {
    return '<span>' + tagHtml(s.key) + (s.layer ? '<span class="count">' + esc(LAYER_LABEL[s.layer]) + '</span>' : '') + '</span>';
  }).join('');

  document.getElementById('footer').innerHTML = (D.meta.notes || []).map(esc).join('<br>') +
    ((D.meta.notes || []).length ? '<br>' : '') + '離線單檔儀表板，摘要數字由產生器依規則計算';

  window.projectDashboard = { data: D, apply: apply, matchWhere: matchWhere };
})();
</script>
</body>
</html>
